<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spatial Hub</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07101a;color:#eef6ff;font:14px system-ui}.top{height:64px;padding:12px 18px;border-bottom:1px solid #26384e;display:flex;justify-content:space-between;align-items:center}.layout{display:grid;grid-template-columns:minmax(0,1fr) 480px;height:calc(100vh - 64px)}canvas{width:100%;height:100%;display:block;background:radial-gradient(circle,#142740,#07101a 70%)}aside{padding:12px;background:#0d1722;border-left:1px solid #26384e;overflow:auto}.card{background:#14202e;border:1px solid #2b4058;border-radius:10px;padding:11px;margin-bottom:9px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab,.scan{padding:8px 11px;border:1px solid #35506b;border-radius:8px;background:#17283a;color:white;cursor:pointer}.active{background:#28506b}.item{width:100%;text-align:left;margin-top:6px;padding:9px;background:#0d1722;color:white;border:1px solid #2b4058;border-radius:8px}.muted{color:#91a7bd;font-size:12px}.warn{background:#251b07;border-color:#694d08;color:#ffd95a}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.counts div{background:#0b1621;border:1px solid #263b51;border-radius:8px;padding:8px}.counts b{font-size:18px}.counts small{display:block;color:#8fa9c1}.qr{display:flex;gap:10px}.qr img{width:110px;background:white;padding:5px;border-radius:7px}.err{margin-top:5px;padding:6px;background:#2a1d08;color:#ffd36b;border-left:3px solid #f59e0b}</style></head><body><div class="top"><div><b style="font-size:18px">Spatial Hub Desktop</b><div class="muted">LAN · Wi‑Fi · Bluetooth · Phone agents</div></div><div><button class="scan" id="scan">Сканировать сейчас</button> <span id="status" class="muted"></span> <b id="ver"></b></div></div><div class="layout"><canvas id="c"></canvas><aside><div class="tabs"><button class="tab active" data-t="all">Обзор</button><button class="tab" data-t="lan">LAN</button><button class="tab" data-t="wifi">Wi‑Fi</button><button class="tab" data-t="ble">Bluetooth</button><button class="tab" data-t="agent">Телефон</button></div><div class="card counts"><div><b id="lan">0</b><small>LAN</small></div><div><b id="wifi">0</b><small>Wi‑Fi</small></div><div><b id="ble">0</b><small>BLE</small></div><div><b id="agent">0</b><small>Agents</small></div></div><div class="card" id="phone" style="display:none"><b>Подключить телефон</b><div class="qr"><img id="qr"><div><b id="code"></b><div id="url" class="muted"></div></div></div></div><div class="card"><b>Выбранное</b><div id="detail" class="muted">Нажми устройство.</div></div><div class="card"><b id="title">Устройства</b><div id="list"></div></div><div class="card"><b>Диагностика</b><div id="errors" class="muted">—</div></div><div class="card warn">Расстояние Wi‑Fi/BLE — приблизительная RSSI-оценка. LAN физическое расстояние не сообщает.</div></aside></div><script>const $=x=>document.getElementById(x),c=$('c'),g=c.getContext('2d');let S={nodes:[],scan:{lan:[],wifi:[],ble:[]},agents:[],t:'all',a:-.7,z:1,p:[]};function E(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function rs(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;g.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',rs);function tr(p){let X=p.x||0,Z=p.z||0,co=Math.cos(S.a),si=Math.sin(S.a),x=X*co-Z*si,z=X*si+Z*co,sc=Math.min(c.clientWidth/13,c.clientHeight/9)*S.z*(9/Math.max(5,9+z));return{x:c.clientWidth/2+x*sc,y:c.clientHeight*.56+(p.y||0)*-sc,sc}}function col(n){return n.kind==='hub'?'white':n.kind==='wifi'?'#38bdf8':n.kind==='ble'?'#a78bfa':n.kind==='lan'?'#34d399':'#f59e0b'}function draw(){g.clearRect(0,0,c.clientWidth,c.clientHeight);S.p=[];for(let n of S.nodes){let p=tr(n.position||{});g.fillStyle=col(n);g.beginPath();g.arc(p.x,p.y,n.kind==='hub'?9:7,0,Math.PI*2);g.fill();g.fillStyle='#dbeafe';g.fillText((n.name||n.kind).slice(0,22),p.x+11,p.y+4);S.p.push({n,p})}}function detail(n){let d=n.distance||{};$('detail').innerHTML=`<b>${E(n.name)}</b><div>${E(n.kind)} · ${E(n.connection||'')}</div>${n.ip?`<div>IP ${E(n.ip)}</div>`:''}${n.address?`<div>${E(n.address)}</div>`:''}${n.signal!=null?`<div>Wi‑Fi ${n.signal}% · RSSI≈${n.rssi} dBm</div>`:''}${n.rssi!=null&&n.kind==='ble'?`<div>BLE RSSI ${n.rssi} dBm</div>`:''}<div>Distance: ${d.available?'≈ '+d.approx_m+' m':'not available'}</div><div class="muted">${E(d.note||'')}</div>`}function list(){let a=S.t==='all'?S.nodes.filter(n=>n.kind!=='hub'):S.t==='agent'?S.agents:S.scan[S.t]||[];$('phone').style.display=S.t==='agent'?'block':'none';$('list').innerHTML='';for(let n of a){let b=document.createElement('button');b.className='item';b.innerHTML=`<b>${E(n.name)}</b><div class="muted">${E(n.ip||n.address||n.connection||'')}</div>`;b.onclick=()=>detail(n);$('list').appendChild(b)}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.t=b.dataset.t;list()});$('scan').onclick=()=>fetch('/api/scan',{method:'POST'});async function info(){let s=await(await fetch('/api/info')).json();$('qr').src=s.qr;$('code').textContent=s.code;$('url').textContent=s.url}async function poll(){try{let s=await(await fetch('/api/state')).json();S.nodes=s.nodes;S.scan=s.scan;S.agents=s.agents;$('ver').textContent='v'+s.version;$('lan').textContent=s.scan.lan.length;$('wifi').textContent=s.scan.wifi.length;$('ble').textContent=s.scan.ble.length;$('agent').textContent=s.agents.length;$('status').textContent=s.scan.running?'scanning…':s.scan.last_scan?new Date(s.scan.last_scan*1000).toLocaleTimeString():'waiting';$('errors').innerHTML=s.scan.errors.length?s.scan.errors.map(x=>`<div class="err">${E(x)}</div>`).join(''):'No errors';list();draw()}catch(e){$('status').textContent='API error'}}setInterval(poll,1400);info();poll();rs();c.onwheel=e=>{e.preventDefault();S.z=Math.max(.5,Math.min(2,S.z*(e.deltaY>0?.9:1.1)));draw()};let down=false,lx=0;c.onpointerdown=e=>{down=true;lx=e.clientX};c.onpointermove=e=>{if(down){S.a+=(e.clientX-lx)*.008;lx=e.clientX;draw()}};c.onpointerup=()=>down=false;c.onclick=e=>{let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,b=null,d=99;for(let q of S.p){let z=Math.hypot(x-q.p.x,y-q.p.y);if(z<14&&z<d){b=q.n;d=z}}if(b)detail(b)};</script></body></html>
