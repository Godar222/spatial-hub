<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark}body{background:#081018;color:#eef6ff;font:16px system-ui;padding:16px}.c{max-width:520px;margin:auto;background:#101b28;padding:14px;border-radius:12px}button,input{width:100%;padding:12px;margin-top:8px;background:#1c3248;color:white;border:1px solid #35506b;border-radius:8px}.ok{color:#34d399}.bad{color:#fb7185}</style></head><body><div class="c"><h2>Spatial Node</h2><input id="name" value="iPhone 16"><button id="join">Подключиться</button><button id="motion">Разрешить движение</button><button id="geo">Разрешить GPS</button><div id="st"></div></div><script>const q=new URLSearchParams(location.search),token=q.get('token'),$=x=>document.getElementById(x);let on=false,s={},id='p-'+Date.now();try{id=localStorage.getItem('sid')||id;localStorage.setItem('sid',id)}catch(e){};$('motion').onclick=async()=>{try{if(DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission&&await DeviceOrientationEvent.requestPermission()!=='granted')throw 0;addEventListener('deviceorientation',e=>s.orientation={alpha:e.alpha,beta:e.beta,gamma:e.gamma});addEventListener('devicemotion',e=>{let a=e.accelerationIncludingGravity||{};s.motion={x:a.x,y:a.y,z:a.z}});$('motion').disabled=true}catch(e){}};$('geo').onclick=()=>navigator.geolocation?.watchPosition(p=>s.geo={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy},()=>{});async function hb(){if(!on)return;let t=performance.now();try{await fetch('/api/ping');s.latency_ms=performance.now()-t;let r=await fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,node_id:id,name:$('name').value,sensors:s})});if(!r.ok)throw 0;$('st').innerHTML='<span class="ok">Подключено</span>'}catch(e){$('st').innerHTML='<span class="bad">Нет связи с Hub</span>';on=false;$('join').disabled=false}}$('join').onclick=()=>{on=true;$('join').disabled=true;hb()};setInterval(hb,1800);</script></body></html>
